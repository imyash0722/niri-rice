general {
    # Use lock.sh (qylock) as lock command — no hyprlock check needed
    lock_cmd = ~/.config/niri/scripts/lock.sh

    # Lock before sleep so screen is secured immediately on wake
    before_sleep_cmd = loginctl lock-session

    # Re-enable monitors on wake
    after_sleep_cmd = niri msg action power-on-monitors
}

# ── On Battery ─────────────────────────────────────────────
# These listeners activate based on AC status automatically via logind.
# hypridle itself does not have AC awareness, so we keep timeouts
# tight enough to cover the battery case and sensible for AC.

# Step 1: Dim screen after 3 minutes of idle
listener {
    timeout = 180
    on-timeout = brightnessctl -s set 20%
    on-resume  = brightnessctl -r
}

# Step 2: Lock screen after 5 minutes of idle
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Step 3: Turn monitors off after 8 minutes of idle
listener {
    timeout = 480
    on-timeout = niri msg action power-off-monitors
    on-resume  = niri msg action power-on-monitors
}

# Step 4: Suspend after 15 minutes of total idle (lid open)
# When lid is closed, logind handles suspend immediately.
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
