# Bespoke Material You Lockscreen (Hyprlock)
# Dynamic Material You palette via colors.conf (Matugen)
# Android 14/15 2-Line Clock & Glassmorphic Translucent Cards

source = $HOME/.config/hypr/colors.conf

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 2
    no_fade_in = false
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    color = $background
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 0.89
    brightness = 0.80
    vibrancy = 0.2
    vibrancy_darkness = 0.1
}

# ── Material You Android 14/15 Clock (Hours) ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = $primary
    font_size = 140
    font_family = Inter, JetBrainsMono Nerd Font Bold
    position = 0, 195
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)
}

# ── Material You Android 14/15 Clock (Minutes) ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = $on_surface
    font_size = 140
    font_family = Inter, JetBrainsMono Nerd Font Bold
    position = 0, 50
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)
}

# ── Material You Translucent Date & Battery Pill ──
shape {
    monitor =
    size = 380, 42
    color = $surface_container_alpha
    rounding = 21
    border_size = 1
    border_color = $outline_variant_alpha
    position = 0, -45
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span font_desc='Inter SemiBold 11'>$(date +'%A, %B %-d')</span>  <span alpha='60%'>|</span>  <span font_desc='JetBrainsMono Nerd Font Bold 11'>󰁹 $(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo 100)%</span>"
    color = $on_surface
    font_size = 11
    font_family = Inter, JetBrainsMono Nerd Font
    position = 0, -45
    halign = center
    valign = center
}

# ── Material You Capsule Password Field ──
input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = $primary
    inner_color = $surface_container_high_alpha
    font_color = $on_surface
    fade_on_empty = false
    placeholder_text = <span font_desc='Inter 11' foreground='##$on_surface_variant_hex'>󰌾  Enter password...</span>
    hide_input = false
    rounding = 27
    check_color = $tertiary
    fail_color = $error
    fail_text = <span font_desc='Inter Bold 11'>$FAIL <b>($ATTEMPTS)</b></span>
    fail_transition = 200
    capslock_color = $tertiary
    position = 0, -120
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.25)
}

# ── Fingerprint & Unlock Status ──
label {
    monitor =
    text = 󰈷 Scan fingerprint or press enter
    color = $on_surface_variant
    font_size = 11
    font_family = Inter Medium, JetBrainsMono Nerd Font
    position = 0, -170
    halign = center
    valign = center
}

# ── Top-Right User Badge ──
shape {
    monitor =
    size = 180, 36
    color = $surface_container_alpha
    rounding = 18
    border_size = 1
    border_color = $outline_variant_alpha
    position = -20, -20
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] echo "  $USER"
    color = $on_surface
    font_size = 11
    font_family = Inter SemiBold, JetBrainsMono Nerd Font
    position = -35, -28
    halign = right
    valign = top
}

# ── Native PAM & Fingerprint Authentication ──
auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = true
    fingerprint:ready = 󰈷 Ready to scan fingerprint
    fingerprint:present = 󰈷 Scanning fingerprint...
}
