[colors-dark]
alpha=0.95
background={{ colors.background.default.hex | replace: "#", "" }}
foreground={{ colors.on_surface.default.hex | replace: "#", "" }}

## Normal/regular colors (color0-color7)
regular0={{ colors.surface.default.hex | replace: "#", "" }}
regular1={{ colors.error.default.hex | replace: "#", "" }}
regular2={{ colors.secondary.default.hex | replace: "#", "" }}
regular3={{ colors.tertiary.default.hex | replace: "#", "" }}
regular4={{ colors.primary.default.hex | replace: "#", "" }}
regular5={{ colors.tertiary_container.default.hex | replace: "#", "" }}
regular6={{ colors.secondary_container.default.hex | replace: "#", "" }}
regular7={{ colors.on_surface.default.hex | replace: "#", "" }}

## Bright colors (color8-color15)
bright0={{ colors.surface_container_highest.default.hex | replace: "#", "" }}
bright1={{ colors.error_container.default.hex | replace: "#", "" }}
bright2={{ colors.secondary.default.hex | replace: "#", "" }}
bright3={{ colors.tertiary.default.hex | replace: "#", "" }}
bright4={{ colors.primary.default.hex | replace: "#", "" }}
bright5={{ colors.tertiary_fixed.default.hex | replace: "#", "" }}
bright6={{ colors.secondary_fixed.default.hex | replace: "#", "" }}
bright7={{ colors.on_primary_container.default.hex | replace: "#", "" }}
