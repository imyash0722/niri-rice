[colors-dark]
alpha=0.90
background={{ colors.surface_container_lowest.default.hex | replace: "#", "" }}
foreground={{ colors.on_surface.default.hex | replace: "#", "" }}

## Normal/regular colors (color0-color7)
regular0={{ colors.surface_container_lowest.default.hex | replace: "#", "" }}
regular1={{ "#F7768E" | to_color | blend: {{ colors.primary.default.hex | to_color }}, 0.15 | format: "hex" | replace: "#", "" }}
regular2={{ "#9ECE6A" | to_color | blend: {{ colors.primary.default.hex | to_color }}, 0.15 | format: "hex" | replace: "#", "" }}
regular3={{ "#E0AF68" | to_color | blend: {{ colors.primary.default.hex | to_color }}, 0.15 | format: "hex" | replace: "#", "" }}
regular4={{ "#7AA2F7" | to_color | blend: {{ colors.primary.default.hex | to_color }}, 0.15 | format: "hex" | replace: "#", "" }}
regular5={{ "#BB9AF7" | to_color | blend: {{ colors.primary.default.hex | to_color }}, 0.15 | format: "hex" | replace: "#", "" }}
regular6={{ "#7DCFFF" | to_color | blend: {{ colors.primary.default.hex | to_color }}, 0.15 | format: "hex" | replace: "#", "" }}
regular7={{ colors.on_surface.default.hex | replace: "#", "" }}

## Bright colors (color8-color15)
bright0={{ colors.surface_container_highest.default.hex | replace: "#", "" }}
bright1={{ "#FF7A93" | to_color | blend: {{ colors.primary.default.hex | to_color }}, 0.15 | format: "hex" | replace: "#", "" }}
bright2={{ "#B9F27C" | to_color | blend: {{ colors.primary.default.hex | to_color }}, 0.15 | format: "hex" | replace: "#", "" }}
bright3={{ "#FF9E64" | to_color | blend: {{ colors.primary.default.hex | to_color }}, 0.15 | format: "hex" | replace: "#", "" }}
bright4={{ "#7DA6FF" | to_color | blend: {{ colors.primary.default.hex | to_color }}, 0.15 | format: "hex" | replace: "#", "" }}
bright5={{ "#DDB6F2" | to_color | blend: {{ colors.primary.default.hex | to_color }}, 0.15 | format: "hex" | replace: "#", "" }}
bright6={{ "#B4F9F8" | to_color | blend: {{ colors.primary.default.hex | to_color }}, 0.15 | format: "hex" | replace: "#", "" }}
bright7={{ colors.on_surface.default.hex | replace: "#", "" }}
