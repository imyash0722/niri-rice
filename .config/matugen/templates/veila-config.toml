# Veila lockscreen config — Auto-generated by Matugen
# Layout: Clean Minimalist Bottom-Right (No blur tile, simplified clock, underline password bar)
# Colors: Material You from active wallpaper via matugen

[background]
mode = "file"
path = "WALLPAPER_PATH_PLACEHOLDER"
color = "{{ colors.background.default.hex }}"
dim_strength = 15

[battery]
enabled = true

[weather]
enabled = false

[visuals.clock]
format = "24h"
style = "standard"
font_family = "Google Sans Flex"
font_weight = 300
color = "#{{ colors.on_surface.default.hex_stripped }}f2"
font_size = 80
halign = "right"
valign = "bottom"
x = -80
y = -180

[visuals.date]
format = "long"
font_family = "Google Sans Flex"
font_weight = 400
font_size = 18
color = "#{{ colors.on_surface_variant.default.hex_stripped }}b3"
halign = "right"
valign = "bottom"
x = -80
y = -140

[visuals.avatar]
enabled = false

[visuals.username]
enabled = false

[visuals.input]
placeholder = "pineapple"
background_color = "#00000000"
border_color = "#00000000"
border_width = 0
width = 300
height = 40
radius = 0
mask_color = "{{ colors.primary.default.hex }}"
font_family = "Google Sans Flex"
font_weight = 400
font_size = 16
halign = "right"
valign = "bottom"
x = -80
y = -80

[visuals.placeholder]
color = "#{{ colors.on_surface_variant.default.hex_stripped }}80"

[visuals.status]
mode = "inline"
rejected_color = "{{ colors.error.default.hex }}"
pending_color = "#{{ colors.on_surface.default.hex_stripped }}cc"

[visuals.eye]
color = "#{{ colors.primary.default.hex_stripped }}cc"

[visuals.caps_lock]
color = "{{ colors.primary.default.hex }}"

# Clean underline for password input
[[visuals.backdrop]]
enabled = true
name = "input_underline"
mode = "solid"
color = "#{{ colors.primary.default.hex_stripped }}80"
width = 300
height = 2
radius = 1
halign = "right"
valign = "bottom"
x = -80
y = -80
z = 0

[visuals.keyboard]
background_size = 46
radius = 23
background_color = "#{{ colors.surface_container.default.hex_stripped }}40"
color = "#{{ colors.on_surface_variant.default.hex_stripped }}e6"
size = 16
halign = "left"
valign = "top"
x = 24
y = 21

[visuals.battery]
background_color = "#{{ colors.surface_container.default.hex_stripped }}40"
background_size = 46
radius = 23
color = "#{{ colors.on_surface_variant.default.hex_stripped }}e6"
size = 20
halign = "left"
valign = "top"
x = 78
y = 21

[visuals.now_playing]
enabled = true
fade_duration_ms = 320

[visuals.now_playing.artwork]
size = 44
radius = 8
opacity = 90
halign = "left"
valign = "center"
x = 10
y = 0
relative_to = "now_playing"

[visuals.now_playing.artist]
width = 318
color = "#{{ colors.on_surface_variant.default.hex_stripped }}99"
font_family = "Google Sans Flex"
font_size = 16
font_weight = 400
halign = "left"
valign = "top"
x = 65
y = 10
relative_to = "now_playing"

[visuals.now_playing.title]
width = 318
color = "#{{ colors.on_surface.default.hex_stripped }}cc"
font_family = "Google Sans Flex"
font_size = 16
font_weight = 400
halign = "left"
valign = "bottom"
x = 65
y = -10
relative_to = "now_playing"

# Now Playing backdrop on bottom left
[[visuals.backdrop]]
enabled = true
name = "now_playing"
show_when = "now_playing"
mode = "blur"
color = "#{{ colors.background.default.hex_stripped }}33"
blur_strength = 12
radius = 10
border_color = "#{{ colors.outline_variant.default.hex_stripped }}26"
width = 400
height = 60
halign = "left"
valign = "bottom"
x = 40
y = -40
z = 0
