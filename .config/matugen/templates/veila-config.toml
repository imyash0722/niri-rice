# Veila lockscreen config — Auto-generated by Matugen
# Layout: Santorini-style (frosted glass auth panel, wallpaper background)
# Colors: Material You from active wallpaper via matugen

[background]
mode = "file"
path = "WALLPAPER_PATH_PLACEHOLDER"
color = "{{ colors.background.default.hex }}"
dim_strength = 25

[battery]
enabled = true

[weather]
enabled = false

[visuals.clock]
format = "24h"
style = "standard"
font_family = "Google Sans Flex"
font_weight = 600
color = "#{{ colors.on_surface.default.hex_stripped }}e6"
font_size = 88
halign = "center"
valign = "top"
x = 0
y = 40
relative_to = "auth_panel"

[visuals.date]
format = "long"
font_family = "Google Sans Flex"
font_weight = 400
font_size = 18
color = "#{{ colors.on_surface_variant.default.hex_stripped }}b3"
halign = "center"
valign = "top"
x = 0
y = 140
relative_to = "auth_panel"

[visuals.input]
placeholder = "Password"
background_color = "#{{ colors.surface_container.default.hex_stripped }}1a"
border_color = "#{{ colors.primary.default.hex_stripped }}4d"
border_width = 2
width = 310
height = 54
radius = 27
mask_color = "{{ colors.primary.default.hex }}"
font_family = "Google Sans Flex"
font_weight = 400
font_size = 16
halign = "center"
valign = "center"
x = 0
y = 80
relative_to = "auth_panel"

[visuals.status]
mode = "inline"
rejected_color = "{{ colors.error.default.hex }}"
pending_color = "#{{ colors.on_surface.default.hex_stripped }}cc"

[visuals.eye]
color = "#{{ colors.on_surface_variant.default.hex_stripped }}b8"

[visuals.caps_lock]
color = "#{{ colors.on_surface_variant.default.hex_stripped }}85"

[visuals.placeholder]
color = "#{{ colors.on_surface_variant.default.hex_stripped }}cc"

[visuals.avatar]
size = 150
background_color = "#{{ colors.surface_container.default.hex_stripped }}14"
placeholder_padding = 28
ring_color = "{{ colors.primary.default.hex }}"
ring_width = 2
icon_color = "{{ colors.on_surface.default.hex }}"
halign = "center"
valign = "center"
x = 0
y = -120
relative_to = "auth_panel"

[visuals.username]
enabled = true
font_family = "Google Sans Flex"
font_weight = 400
color = "#{{ colors.on_surface.default.hex_stripped }}d9"
font_size = 28
halign = "center"
valign = "center"
x = 0
y = 0
relative_to = "auth_panel"

[visuals.keyboard]
background_size = 46
radius = 23
background_color = "#{{ colors.surface_container.default.hex_stripped }}26"
color = "#{{ colors.on_surface_variant.default.hex_stripped }}ad"
size = 16
halign = "right"
valign = "top"
x = -24
y = 21

[visuals.battery]
background_color = "#{{ colors.surface_container.default.hex_stripped }}26"
background_size = 46
radius = 23
color = "#{{ colors.on_surface_variant.default.hex_stripped }}ad"
size = 20
halign = "right"
valign = "top"
x = -78
y = 21

[visuals.now_playing]
enabled = true
fade_duration_ms = 320

[visuals.now_playing.artwork]
size = 44
radius = 8
opacity = 90
halign = "left"
valign = "center"
x = 10
y = 0
relative_to = "now_playing"

[visuals.now_playing.artist]
width = 318
color = "#{{ colors.on_surface_variant.default.hex_stripped }}63"
font_family = "Google Sans Flex"
font_size = 16
font_weight = 400
halign = "left"
valign = "top"
x = 65
y = 10
relative_to = "now_playing"

[visuals.now_playing.title]
width = 318
color = "#{{ colors.on_surface.default.hex_stripped }}b0"
font_family = "Google Sans Flex"
font_size = 16
font_weight = 400
halign = "left"
valign = "bottom"
x = 65
y = -10
relative_to = "now_playing"

# Now Playing backdrop
[[visuals.backdrop]]
enabled = true
name = "now_playing"
show_when = "now_playing"
mode = "blur"
color = "#{{ colors.surface.default.hex_stripped }}0d"
blur_strength = 12
radius = 10
border_color = "#{{ colors.outline_variant.default.hex_stripped }}26"
width = 400
height = 60
halign = "right"
valign = "bottom"
x = -40
y = -40
z = 0

# Auth panel — frosted glass panel (Santorini-style)
[[visuals.backdrop]]
enabled = true
name = "auth_panel"
mode = "blur"
color = "#{{ colors.surface.default.hex_stripped }}26"
blur_strength = 14
radius = 16
border_color = "#{{ colors.outline_variant.default.hex_stripped }}40"
border_width = 1
width = 540
full_height = true
halign = "left"
valign = "center"
inset_top = 100
inset_bottom = 100
x = 100
y = 0
z = 0
