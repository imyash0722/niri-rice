# Veila lockscreen config — Auto-generated by Matugen
# Layout: Clean Bottom-Left (No blur tile background, edge-aligned datetime, user, password)
# Colors: Material You from active wallpaper via matugen

[background]
mode = "file"
path = "WALLPAPER_PATH_PLACEHOLDER"
color = "{{ colors.background.default.hex }}"
dim_strength = 15

[battery]
enabled = true

[weather]
enabled = false

[visuals.clock]
format = "24h"
style = "standard"
font_family = "Google Sans Flex"
font_weight = 600
color = "#{{ colors.on_surface.default.hex_stripped }}f2"
font_size = 88
halign = "left"
valign = "bottom"
x = 80
y = -245

[visuals.date]
format = "long"
font_family = "Google Sans Flex"
font_weight = 400
font_size = 20
color = "#{{ colors.on_surface_variant.default.hex_stripped }}d9"
halign = "left"
valign = "bottom"
x = 84
y = -205

[visuals.avatar]
enabled = true
size = 38
background_color = "#{{ colors.surface_container.default.hex_stripped }}33"
placeholder_padding = 6
ring_color = "{{ colors.primary.default.hex }}"
ring_width = 2
icon_color = "{{ colors.on_surface.default.hex }}"
halign = "left"
valign = "bottom"
x = 84
y = -142

[visuals.username]
enabled = true
font_family = "Google Sans Flex"
font_weight = 500
color = "#{{ colors.on_surface.default.hex_stripped }}e6"
font_size = 20
halign = "left"
valign = "bottom"
x = 136
y = -152

[visuals.input]
placeholder = "Password"
background_color = "#{{ colors.surface_container.default.hex_stripped }}40"
border_color = "#{{ colors.primary.default.hex_stripped }}66"
border_width = 2
width = 310
height = 50
radius = 25
mask_color = "{{ colors.primary.default.hex }}"
font_family = "Google Sans Flex"
font_weight = 400
font_size = 16
halign = "left"
valign = "bottom"
x = 80
y = -70

[visuals.status]
mode = "inline"
rejected_color = "{{ colors.error.default.hex }}"
pending_color = "#{{ colors.on_surface.default.hex_stripped }}cc"

[visuals.eye]
color = "#{{ colors.on_surface_variant.default.hex_stripped }}b8"

[visuals.caps_lock]
color = "#{{ colors.on_surface_variant.default.hex_stripped }}85"

[visuals.placeholder]
color = "#{{ colors.on_surface_variant.default.hex_stripped }}99"

[visuals.keyboard]
background_size = 46
radius = 23
background_color = "#{{ colors.surface_container.default.hex_stripped }}40"
color = "#{{ colors.on_surface_variant.default.hex_stripped }}e6"
size = 16
halign = "right"
valign = "top"
x = -24
y = 21

[visuals.battery]
background_color = "#{{ colors.surface_container.default.hex_stripped }}40"
background_size = 46
radius = 23
color = "#{{ colors.on_surface_variant.default.hex_stripped }}e6"
size = 20
halign = "right"
valign = "top"
x = -78
y = 21

[visuals.now_playing]
enabled = true
fade_duration_ms = 320

[visuals.now_playing.artwork]
size = 44
radius = 8
opacity = 90
halign = "left"
valign = "center"
x = 10
y = 0
relative_to = "now_playing"

[visuals.now_playing.artist]
width = 318
color = "#{{ colors.on_surface_variant.default.hex_stripped }}99"
font_family = "Google Sans Flex"
font_size = 16
font_weight = 400
halign = "left"
valign = "top"
x = 65
y = 10
relative_to = "now_playing"

[visuals.now_playing.title]
width = 318
color = "#{{ colors.on_surface.default.hex_stripped }}cc"
font_family = "Google Sans Flex"
font_size = 16
font_weight = 400
halign = "left"
valign = "bottom"
x = 65
y = -10
relative_to = "now_playing"

# Now Playing backdrop (only appears when media is active)
[[visuals.backdrop]]
enabled = true
name = "now_playing"
show_when = "now_playing"
mode = "blur"
color = "#{{ colors.background.default.hex_stripped }}33"
blur_strength = 12
radius = 10
border_color = "#{{ colors.outline_variant.default.hex_stripped }}26"
width = 400
height = 60
halign = "right"
valign = "bottom"
x = -40
y = -40
z = 0
