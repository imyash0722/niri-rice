[config]

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"
post_hook = "pkill -x waybar 2>/dev/null; sleep 0.15; setsid waybar >/dev/null 2>&1 &"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

[templates.mako]
input_path = "~/.config/matugen/templates/mako-config"
output_path = "~/.config/mako/config"
post_hook = "makoctl reload 2>/dev/null || true"

[templates.wal]
input_path = "~/.config/matugen/templates/wal-colors.json"
output_path = "~/.cache/wal/colors.json"

[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock-colors.conf"
output_path = "~/.config/hypr/colors.conf"

[templates.veila]
input_path = "~/.config/matugen/templates/veila-config.toml"
output_path = "~/.config/veila/config.toml"
post_hook = "WALLPAPER=$(python3 -c \"import json,os; d=json.load(open(os.path.expanduser('~/.cache/wal/colors.json'))); print(d.get('wallpaper',''))\" 2>/dev/null); if [ -n \"$WALLPAPER\" ]; then sed -i \"s|WALLPAPER_PATH_PLACEHOLDER|$WALLPAPER|g\" ~/.config/veila/config.toml; fi; veila reload 2>/dev/null || systemctl --user restart veilad 2>/dev/null || true"

[templates.wezterm]
input_path = "~/.config/matugen/templates/wezterm-colors.lua"
output_path = "~/.config/wezterm/colors.lua"

[templates.btop]
input_path = "~/.config/matugen/templates/btop-theme.theme"
output_path = "~/.config/btop/themes/matugen.theme"

[templates.sddm]
input_path = "~/.config/matugen/templates/sddm-theme.conf"
output_path = "/usr/share/sddm/themes/veila/theme.conf"

[templates.kando]
input_path = "~/.config/matugen/templates/kando-theme.json"
output_path = "~/.config/kando/menu-themes/nether-m3-expressive/theme.json"
post_hook = "kando --reload-menu-theme 2>/dev/null || true"

[templates.kde]
input_path = "~/.config/matugen/templates/kde-material-you.colors"
output_path = "~/.local/share/color-schemes/Matugen.colors"
post_hook = 'ACCENT=$(kreadconfig6 --file ~/.local/share/color-schemes/Matugen.colors --group General --key AccentColor 2>/dev/null); if [ -n "$ACCENT" ]; then kwriteconfig6 --file kdeglobals --group General --key AccentColor "$ACCENT"; kwriteconfig6 --file kdeglobals --group General --key LastUsedCustomAccentColor "$ACCENT"; fi; kwriteconfig6 --file kdeglobals --group General --key ColorScheme ""; plasma-apply-colorscheme Matugen 2>/dev/null || true'

[templates.konsole]
input_path = "~/.config/matugen/templates/konsole-theme.colorscheme"
output_path = "~/.local/share/konsole/Matugen.colorscheme"

[templates.rice-settings]
input_path = "~/.config/matugen/templates/rice-settings.css"
output_path = "~/.cache/rice-settings/theme.css"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-3.0/colors.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-4.0/colors.css"





