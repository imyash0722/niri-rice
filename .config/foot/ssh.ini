# ~/.config/foot/ssh.ini — Foot Terminal Profile for Remote SSH Sessions
# Tailored for Ubuntu / Ubunly ZSH Theme (Aubergine + Ubuntu Orange)

[main]
term=xterm-256color
font=JetBrainsMono Nerd Font:size=12.1
pad=15x15 center
resize-by-cells=no

[csd]
preferred=none

[colors-dark]
alpha=0.95
background=2c001e
foreground=eeeeec
cursor=2c001e e95420

## Normal / regular colors (matches Ubuntu / Ubunly palette)
regular0=2c001e
regular1=de382b
regular2=39b54a
regular3=e95420
regular4=2a82da
regular5=762671
regular6=2cb5e9
regular7=eeeeec

## Bright colors
bright0=555753
bright1=ef2929
bright2=8ae234
bright3=ffb800
bright4=32afff
bright5=ad7fa8
bright6=34e2e2
bright7=ffffff
