# Kitty Configuration - Niri Rice
# Dynamic Material You theming via colors.conf (end-4 style)

include ./colors.conf

# ── Font & Typography ──
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ── Cursor & Animation ──
cursor_shape     beam
cursor_trail     1

# ── Window Styling & Translucency ──
background_opacity         0.90
background_blur            1
dynamic_background_opacity yes
window_padding_width       14
confirm_os_window_close    0
hide_window_decorations    yes
remember_window_size       no
initial_window_width       960
initial_window_height      600

# ── Shell & Session ──
shell                      /usr/bin/zsh
close_on_child_death       no

# ── Remote Control (for live Matugen palette reload) ──
allow_remote_control       yes
listen_on                  unix:/tmp/kitty-{kitty_pid}

# ── Clipboard & Copy/Paste ──
map ctrl+shift+c           copy_to_clipboard
map ctrl+shift+v           paste_from_clipboard

# ── Keybindings for Tmux Fast Tab Switching ──
map ctrl+tab               send_text all \x1b[27;5;9~
map ctrl+shift+tab         send_text all \x1b[27;6;9~

# ── Scroll & Zoom ──
map page_up                scroll_page_up
map page_down              scroll_page_down

map ctrl+plus              change_font_size all +1
map ctrl+equal             change_font_size all +1
map ctrl+kp_add            change_font_size all +1
map ctrl+minus             change_font_size all -1
map ctrl+underscore        change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0                 change_font_size all 0
map ctrl+kp_0              change_font_size all 0

# ── URLs & Hyperlinks Clickability (inside Tmux, AI tools, and CLI) ──
url_style                  curly
open_url_with              default
detect_urls                yes
underline_hyperlinks       hover
url_prefixes               file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
copy_on_select             no
strip_trailing_spaces      smart
mouse_hide_wait            3.0
enable_audio_bell          no
visual_bell_duration       0.0

# 1. Plain click directly on a link opens it (aborts if selecting text)
mouse_map left click grabbed,ungrabbed mouse_handle_click selection link

# 2. Universal Ctrl+Click on ANY link/URL (discards press to prevent tmux pane swap)
mouse_map ctrl+left press grabbed discard_event
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link

# 3. Shift+Click fallback
mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection link prompt

# 4. Keyboard hints for links (Ctrl+Shift+E opens any visible URL)
map ctrl+shift+e           open_url_with_hints
map ctrl+shift+p>f         kitten hints --type path --program default
map ctrl+shift+p>h         kitten hints --type hyperlink

