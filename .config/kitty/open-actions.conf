# ~/.config/kitty/open-actions.conf
# Custom actions for clicked URLs in Kitty

# 1. File URLs (with optional #L10 fragment or line number): Open via rice-ctl smart opener
protocol file
action launch --type=background ~/.local/bin/rice-ctl open "${URL}"

# 2. HTTP / HTTPS URLs: Open via rice-ctl smart opener (xdg-open -> default browser)
protocol http,https
action launch --type=background ~/.local/bin/rice-ctl open "${URL}"
