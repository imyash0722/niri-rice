# ~/.config/tmux/tmux.conf - Optimized for Foot, Wayland, and Neovim

# 1. Prefix: Use Ctrl+Space
set -g prefix C-Space
unbind C-b
unbind C-a
unbind C-q
bind C-Space send-prefix

# 2. Critical Neovim Fixes: Zero escape latency & 24-bit TrueColor
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"

# 3. Enable Mouse Support (Scroll & Resize)
set -g mouse on

# 4. Vi Mode & Comprehensive Wayland Clipboard Integration (wl-copy)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "wl-copy"
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "wl-copy"
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel
bind p paste-buffer

# 5. Intuitive Window & Pane Splitting (inherits current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# 6. Vim-style Pane Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 7. Start Window and Pane Indexing at 1 (Matches keyboard row 1-9)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 8. Status Bar Styling (Harmonized with Rice Accent & Theme)
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=#d2d0da"
set -g status-left "#[bold,fg=#9B6E71] #S #[default]│ "
set -g status-right "#[fg=#d2d0da]%H:%M #[fg=#9B6E71]• #[default]"
setw -g window-status-current-format "#[bold,fg=#9B6E71] #I:#W* #[default]"
setw -g window-status-format "#[fg=#706e80] #I:#W #[default]"
