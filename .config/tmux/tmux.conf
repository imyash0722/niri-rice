# ~/.config/tmux/tmux.conf - Optimized for Foot, Wayland, and Neovim

# 1. Prefix: Use Ctrl+Space
set -g prefix C-Space
unbind C-b
unbind C-a
unbind C-q
bind C-Space send-prefix

# 2. Critical Neovim Fixes: Zero escape latency & 24-bit TrueColor
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"

# 2.5 Agentic CLI & Modern TUI Fixes (Antigravity, Claude Code, Aider, Fast Streaming)
set -g allow-passthrough on
set -s extended-keys on
set -g focus-events on
set -g history-limit 100000
set -s set-clipboard on
set -as terminal-features ",*:sync"
set -as terminal-features ",*:hyperlinks"
set -as terminal-features ",xterm-kitty:hyperlinks:RGB:sync:usstyle:cstyle:extkeys"
set -as update-environment "TERM_PROGRAM"
set -as update-environment "FORCE_HYPERLINK"

# 3. Enable Mouse Support (Scroll & Resize)
set -g mouse on

# 4. Vi Mode & Comprehensive Wayland Clipboard Integration (wl-copy)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "wl-copy"
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "wl-copy"
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel
bind p paste-buffer
 
# 4.5 Clickable Hyperlinks & URLs (AI CLI Tools, Compilers, Web Links)
# Ctrl+Click to open any OSC 8 hyperlink or detected URL under the mouse
bind-key -T root C-MouseDown1Pane \
    if-shell -F -t = "#{mouse_hyperlink}" {
        run-shell -b "~/.local/bin/rice-ctl open '#{mouse_hyperlink}'"
    } {
        if-shell -F -t = "#{m/r:^(https?|file)://,#{mouse_word}}" {
            run-shell -b "~/.local/bin/rice-ctl open '#{q:mouse_word}'"
        } {
            select-pane -t =
            send-keys -M
        }
    }

bind-key -T copy-mode-vi C-MouseDown1Pane \
    if-shell -F -t = "#{mouse_hyperlink}" {
        run-shell -b "~/.local/bin/rice-ctl open '#{mouse_hyperlink}'"
    } {
        if-shell -F -t = "#{m/r:^(https?|file)://,#{mouse_word}}" {
            run-shell -b "~/.local/bin/rice-ctl open '#{q:mouse_word}'"
        } {
            select-pane -t =
        }
    }

# Double-click: open hyperlink if clicked directly on an OSC 8 link, else select word
bind-key -T root DoubleClick1Pane \
    if-shell -F -t = "#{mouse_hyperlink}" {
        run-shell -b "~/.local/bin/rice-ctl open '#{mouse_hyperlink}'"
    } {
        select-pane -t =
        copy-mode -M
        send-keys -X select-word
        send-keys -X copy-pipe-and-cancel "wl-copy"
    }

# Vi copy mode: press 'o' over any hyperlink or URL to open it
bind-key -T copy-mode-vi o \
    if-shell -F "#{copy_cursor_hyperlink}" {
        run-shell -b "~/.local/bin/rice-ctl open '#{copy_cursor_hyperlink}'"
    } {
        if-shell -F "#{m/r:^(https?|file)://,#{copy_cursor_word}}" {
            run-shell -b "~/.local/bin/rice-ctl open '#{q:copy_cursor_word}'"
        }
    }

# Right-click context menu: quick link opening & copying
bind-key -T root MouseDown3Pane \
    if-shell -F -t = "#{mouse_hyperlink}" {
        display-menu -T "#[align=centre]Hyperlink" -t = -x M -y M \
            "󰌹 Open Link" o { run-shell -b "~/.local/bin/rice-ctl open '#{mouse_hyperlink}'" } \
            "󰅍 Copy Link" c { set-buffer "#{mouse_hyperlink}" }
    } {
        if-shell -F -t = "#{m/r:^(https?|file)://,#{mouse_word}}" {
            display-menu -T "#[align=centre]URL" -t = -x M -y M \
                "󰌹 Open URL" o { run-shell -b "~/.local/bin/rice-ctl open '#{q:mouse_word}'" } \
                "󰅍 Copy URL" c { set-buffer "#{q:mouse_word}" }
        } {
            select-pane -t =
            send-keys -M
        }
    }

# Fast Link Picker: Prefix + u opens interactive fuzzy menu of all links in current pane
bind-key u run-shell -b "~/.local/bin/rice-ctl link-picker"

# 5. Intuitive Window & Pane Splitting (inherits current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# 5.5 Fast Tab (Window) Switching with Ctrl+Tab and Ctrl+Shift+Tab
bind-key -n C-Tab next-window
bind-key -n C-S-Tab previous-window
bind-key -n C-BTab previous-window

# User-keys fallback for raw terminal sequences
set -s user-keys[0] "\e[27;5;9~"
bind-key -n User0 next-window
set -s user-keys[1] "\e[27;6;9~"
bind-key -n User1 previous-window
set -s user-keys[2] "\e[9;5u"
bind-key -n User2 next-window
set -s user-keys[3] "\e[9;6u"
bind-key -n User3 previous-window

# 6. Vim-style Pane Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 7. Start Window and Pane Indexing at 1 (Matches keyboard row 1-9)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 8. Status Bar Styling (Harmonized with Rice Accent & Theme)
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=#d2d0da"
set -g status-left "#[bold,fg=#9B6E71] #S #[default]│ "
set -g status-right "#[fg=#d2d0da]%H:%M #[fg=#9B6E71]• #[default]"
setw -g window-status-current-format "#[bold,fg=#9B6E71] #I:#W* #[default]"
setw -g window-status-format "#[fg=#706e80] #I:#W #[default]"
